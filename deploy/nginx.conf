# nginx 反向代理配置（WebSocket + 静态资源）
# 用法：cp deploy/nginx.conf /etc/nginx/sites-available/mahjong
#       ln -s /etc/nginx/sites-available/mahjong /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx
server {
    listen 80;
    server_name _;   # 改成你的域名，如 mahjong.example.com

    # 可选：限制单 IP 连接数，防刷房间
    # limit_conn_zone $binary_remote_addr zone=mj:10m;
    # limit_conn mj 10;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # WebSocket 升级头（关键，否则无法联机）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;   # 长连接保活
        proxy_send_timeout 300s;
    }
}
